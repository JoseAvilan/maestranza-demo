[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aplicación de una sola página: cualquier ruta se resuelve en el cliente.
# Sin esto, recargar /ordenes/ot-119 devolvería 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker de MSW debe servirse sin caché y con alcance raíz:
# si queda cacheado, un despliegue nuevo seguiría usando el worker viejo.
[[headers]]
  for = "/mockServiceWorker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
